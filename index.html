<!DOCTYPE html>
<html>
<head>
    <title>Student Database Test</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
    <h1>Student Registration</h1>
    <input type="text" id="name" placeholder="Enter name">
    <input type="number" id="age" placeholder="Enter age">
    <button onclick="saveStudent()">Save Student</button>
    <p id="message"></p>

    <script>
        const SUPABASE_URL = https://lkpnxnzagfbjcwoiltij.supabase.co;
        const SUPABASE_KEY = sb_publishable_V-qO2Xpbs7AQapyBK3W7gQ_GzpWAG-t; // Settings > API nundi teesuko

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function saveStudent() {
            const name = document.getElementById("name").value;
            const age = document.getElementById("age").value;

            if (!name || !age) {
                document.getElementById("message").innerText = "Please enter name and age.";
                return;
            }

            const { data, error } = await supabaseClient
                .from("students")
                .insert([{ name: name, age: Number(age) }]);

            if (error) {
                console.error(error);
                document.getElementById("message").innerText = "Error: " + error.message;
                return;
            }

            document.getElementById("message").innerText = "Student saved successfully! ✅";
            document.getElementById("name").value = "";
            document.getElementById("age").value = "";
        }
    </script>
</body>
</html>
